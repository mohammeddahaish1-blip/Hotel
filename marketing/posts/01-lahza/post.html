<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --teal: #0d6b5f; --deep: #0e4643; --gold: #d9a531; --cream: #f6f4ef; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--deep); }
  .post { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: "IBM Plex Sans Arabic", sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
  /* covers the flat band and its hard edge at the top of the photo */
  /* the photo's flat band ends in a hard line at 448px: stay solid past it, then fade into the room */
  .shade { position: absolute; inset: 0 0 auto 0; height: 700px;
    background: linear-gradient(180deg, #0e4643 0px, #145a54 300px, #17625c 480px, rgba(23, 98, 92, 0.75) 560px, rgba(23, 98, 92, 0) 700px); }
  .glow { position: absolute; top: -180px; inset-inline-start: -160px; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(217, 165, 49, 0.22), transparent 65%); }
  .top { position: absolute; top: 56px; inset-inline: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand b { font-family: "Amiri", serif; font-size: 76px; line-height: 1; color: #fff; }
  .brand span { font-size: 22px; font-weight: 500; color: rgba(255, 255, 255, 0.78); padding-inline-start: 16px; border-inline-start: 2px solid rgba(217, 165, 49, 0.7); line-height: 1.4; }
  .tag { font-size: 20px; font-weight: 600; color: var(--gold); border: 1.5px solid rgba(217, 165, 49, 0.6); border-radius: 999px; padding: 8px 22px; }
  .head { position: absolute; top: 210px; inset-inline: 64px; }
  h1 { font-size: 84px; font-weight: 700; line-height: 1.2; letter-spacing: -0.5px; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.18); }
  h1 .hl { display: inline-block; margin-top: 10px; background: var(--gold); color: #2b1d00; border-radius: 22px; padding: 0 26px 6px; }
  .sub { margin-top: 22px; font-size: 28px; font-weight: 500; line-height: 1.6; color: rgba(255, 255, 255, 0.88); max-width: 760px; }
  /* small live cards over the photo, like the product page */
  .chip { position: absolute; display: flex; align-items: center; gap: 14px; background: #fff; color: #1c2321; border-radius: 22px;
    padding: 16px 22px; font-size: 24px; font-weight: 600; box-shadow: 0 22px 40px -18px rgba(0, 0, 0, 0.55); }
  .chip i { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; font-style: normal; font-size: 22px; }
  .chip small { display: block; font-size: 17px; font-weight: 500; color: #66706c; }
  .c1 { top: 640px; inset-inline-end: 56px; } .c1 i { background: #e6f4ea; color: #157f3b; }
  .c2 { top: 790px; inset-inline-end: 96px; } .c2 i { background: #fbf1d6; color: #9a6700; }
  .bar { position: absolute; inset: auto 40px 40px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px;
    background: rgba(14, 70, 67, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px; padding: 24px 30px; }
  .cta { background: var(--gold); color: #2b1d00; font-weight: 700; font-size: 28px; border-radius: 999px; padding: 14px 34px; white-space: nowrap; }
  .meta { font-size: 22px; line-height: 1.5; color: rgba(255, 255, 255, 0.85); }
  .meta b { display: block; font-size: 26px; color: #fff; }
  .url { direction: ltr; font-size: 22px; font-weight: 600; color: rgba(255, 255, 255, 0.9); letter-spacing: 0.3px; }
</style>
</head>
<body>
<div class="post">
  <img class="bg" src="bg.png" alt="">
  <div class="shade"></div>
  <div class="glow"></div>

  <div class="top">
    <div class="brand"><b>نُزُل</b><span>نظام إدارة الفنادق<br>والشقق الفندقية</span></div>
    <div class="tag">صُنع في عُمان</div>
  </div>

  <div class="head">
    <h1>اعرف ما يجري في فندقك<br><span class="hl">لحظة بلحظة</span></h1>
    <p class="sub">الحجوزات والاستقبال والفواتير والتنظيف، كلها في جوالك.</p>
  </div>

  <div class="chip c1"><i>✓</i><span>الوحدة 204 جاهزة<small>أنهى التنظيف قبل دقيقتين</small></span></div>
  <div class="chip c2"><i>↘</i><span>وصول اليوم: 3 نزلاء</span></div>

  <div class="bar">
    <div class="meta"><b>الشهر الأول مجاناً</b>بدون بطاقة دفع</div>
    <div class="url">nuzul-hotel.vercel.app</div>
    <div class="cta">اطلب تجربة النظام</div>
  </div>
</div>
</body>
</html>
