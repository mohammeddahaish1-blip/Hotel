# Every push: typecheck, lint, build, and all database tests on a fresh Postgres.
name: CI
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-24.04
    env:
      # Public values (same as .env.example); the build inlines them into the browser bundle
      NEXT_PUBLIC_SUPABASE_URL: https://isijnklsskwbdbmmertk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_o2e8vZKQlTG1nMz_0X7Ysw_nM4g6xvJ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: infra/scripts/test-sql.sh
